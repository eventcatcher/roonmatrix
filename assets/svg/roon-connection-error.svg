<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <!-- Cuts a transparent gap around the slash so it stays readable on any background -->
    <mask id="slash-gap">
      <rect width="96" height="96" fill="#fff"/>
      <line x1="10" y1="10" x2="86" y2="86" stroke="#000" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Roon symbol -->
  <g fill="#3a3a3a" mask="url(#slash-gap)">
    <path d="M48 9 A39 39 0 0 0 48 87 Z"/>
    <rect x="52" y="12" width="6" height="72" rx="3"/>
    <rect x="62" y="33" width="6" height="31" rx="3"/>
    <rect x="72" y="24" width="6" height="48" rx="3"/>
    <rect x="82" y="42" width="6" height="12" rx="3"/>
  </g>
  <!-- Error slash -->
  <line x1="10" y1="10" x2="86" y2="86" stroke="#e02424" stroke-width="8" stroke-linecap="round"/>
</svg>
