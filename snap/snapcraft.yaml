name: roonmatrix
version: '2.0.0'
summary: App to control your LED-matrix device
description: |
  App to control your own LED matrix hardware, which can display a wide range of informations: Music played from Roon, Apple Music or Spotify, weather data, RSS feeds, custom text messages, and more. The Roonmatrix is a free maker project, and describes step by step how to build your own LED matrix display hardware. And with this app you can configure your hardware extensively, and specify from which sources the text to display is composed. With the app you can send text messages directly to your device, control the display speed, brightness and much more.

title: Roonmatrix
website: 
  - https://www.roonmatrix.com
source-code:
  - https://github.com/eventcatcher/roonmatrix
contact: 
  - support@wilhelm-devblog.de
license: GPL-3.0+

base: core24
confinement: strict
grade: stable

apps:
  roonmatrix:
    command: Roonmatrix
    extensions: [gnome]
    environment:
      GDK_BACKEND: x11
      GTK_MODULES: ""
      G_MESSAGES_DEBUG: ""
      G_LOG_LEVEL: "ERROR"
      NO_AT_BRIDGE: "1"
      GTK_A11Y: "none"
    plugs:
      - opengl
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - gsettings
      - icon-themes
      - gtk-3-themes
      - home
      - network
      - network-status
      - network-bind
      - network-manager-observe

parts:
  roonmatrix:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
  
    build-snaps: [flutter/latest/stable]

    # Build manually instead of "craftctl default": the serious_python CMake
    # only bundles app/ and site-packages/ if SERIOUS_PYTHON_APP /
    # SERIOUS_PYTHON_SITE_PACKAGES are set AND exist at cmake configure time,
    # so package + flutter build must run in the same shell.
    override-build: |
      set -eux
      export SERIOUS_PYTHON_VERSION="3.14"
      export SERIOUS_PYTHON_SITE_PACKAGES="$CRAFT_PART_BUILD/build/site-packages"
      export SERIOUS_PYTHON_APP="$CRAFT_PART_BUILD/build/app"

      # Drop stale build output copied from the source tree (old CMake cache).
      rm -rf build/linux build/app build/site-packages

      cd packages/python_backend
      dart run serious_python:main package ../../app/src -p Linux -r -r -r ../../app/src/requirements.txt
      cd ../../
      test -f "$SERIOUS_PYTHON_APP/roonmatrix.py"

      flutter build linux --release --verbose --target lib/main.dart

      BUNDLE="$(echo build/linux/*/release/bundle)"
      test -f "$BUNDLE/app/roonmatrix.py"
      cp -r "$BUNDLE"/* "$CRAFT_PART_INSTALL/"

    # This appears to be needed when building in the Snap Store.
    build-packages:
      - curl
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - llvm
      - lld

platforms:
  amd64:
  arm64:
