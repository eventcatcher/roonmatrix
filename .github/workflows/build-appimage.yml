name: Build AppImage

# Trigger:
# - Push on Tag (Release / Beta)
# - manual trigger
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    # Matrix: x86_64 und ARM64
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    runs-on: ubuntu-22.04

    env:
      APPIMAGE_DIR: appimage
      APPDIR_NAME: Roonmatrix.AppDir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libfuse2 wget

      - name: Install linuxdeploy
        run: |
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy

      - name: Install linuxdeploy-plugin-gtk script
        run: |
          wget -O linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh
          sudo mv linuxdeploy-plugin-gtk.sh /usr/local/bin/linuxdeploy-plugin-gtk

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'   # or actual stable flutter version
          channel: stable
          cache: true

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Determine build type
        id: buildtype
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            if [[ "${GITHUB_REF}" == *"-beta"* ]]; then
              echo "BUILD_TYPE=pre-release" >> $GITHUB_ENV
            else
              echo "BUILD_TYPE=release" >> $GITHUB_ENV
            fi
          else
            DATE=$(date +%Y%m%d-%H%M)
            echo "VERSION=${VERSION}-nightly-${DATE}" >> $GITHUB_ENV
            echo "BUILD_TYPE=nightly" >> $GITHUB_ENV
          fi
          echo "Build type: $BUILD_TYPE, version: $VERSION"

      - name: Cleanup before packaging
        run: |
          rm -rf app/src/.venv
          rm -rf app/src/build
          rm -rf app/src/dist
          rm -rf app/src/.dart_tool

      - name: Build Python packages - run 1/2
        working-directory: packages/python_backend
        run: |
          export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/app/src/__pypackages__"
          dart run serious_python:main package ../../app/src -p Linux --asset ./assets/backend/roonmatrix.zip -r -r -r ../../app/src/requirements.txt

      - name: Build Python packages - run 2/2
        working-directory: packages/python_backend
        run: |
          export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/app/src/__pypackages__"
          dart run serious_python:main package ../../app/src -p Linux --asset ./assets/backend/roonmatrix.zip -r -r -r ../../app/src/requirements.txt

      - name: Inspect ZIP
        run: |
          echo "ZIP file:"
          ls -lh packages/python_backend/assets/backend/roonmatrix.zip

          echo ""
          echo "Disk usage:"
          du -h packages/python_backend/assets/backend/roonmatrix.zip

          echo ""
          echo "ZIP contents count:"
          unzip -l packages/python_backend/assets/backend/roonmatrix.zip | tail -1

      - name: Build Flutter Linux release
        env:
          FLUTTER_TARGET: ${{ matrix.arch == 'x86_64' && 'linux-x64' || 'linux-arm64' }}
        run: flutter build linux --release --target-platform $FLUTTER_TARGET

      - name: Install FUSE for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install appimagetool
        run: |
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build AppImage
        run: |
          chmod +x $APPIMAGE_DIR/build-appimage.sh
          ./appimage/build-appimage.sh ${{ matrix.arch }}

      # Upload AppImage only for release / pre-release
      - name: Upload AppImage to GitHub Release
        if: ${{ env.BUILD_TYPE != 'nightly' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            appimage/*.AppImage
          prerelease: ${{ env.BUILD_TYPE == 'pre-release' }}

      # -----------------------------
      # Store nightly build as artifact
      - name: Upload Nightly Build
        if: ${{ env.BUILD_TYPE == 'nightly' }}
        uses: actions/upload-artifact@v4
        with:
          name: Roonmatrix-nightly
          path: appimage/*.AppImage

      - name: Summary
        run: |
          echo "Build type: $BUILD_TYPE"
          echo "AppImage created: $(ls $APPIMAGE_DIR/*.AppImage)"
